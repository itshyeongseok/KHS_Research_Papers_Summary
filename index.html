<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KHS Research Papers Summary</title>
    <style>
        :root {
            --primary: #005b96;
            --primary-light: #e8f1f9;
            --bg: #ffffff;
            --surface: #fafbfc;
            --border: #e1e5e8;
            --text: #1f2328;
            --text-soft: #656d76;
            --text-muted: #8b949e;
            --read-fade: 0.55;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px rgba(0,91,150,0.10);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--surface);
            color: var(--text);
            line-height: 1.55;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        /* Header */
        header.hero {
            background: linear-gradient(135deg, #005b96 0%, #0086d6 100%);
            color: white;
            padding: 36px 32px 28px;
        }
        .hero-inner { max-width: 1280px; margin: 0 auto; }
        .hero h1 { margin: 0 0 8px; font-size: 32px; font-weight: 700; letter-spacing: -0.3px; }
        .hero .meta { opacity: 0.92; font-size: 14px; }

        /* Sticky filter bar */
        .filterbar {
            position: sticky;
            top: 0;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            z-index: 50;
            padding: 14px 32px;
            box-shadow: 0 1px 0 rgba(0,0,0,0.02);
        }
        .filterbar-inner {
            max-width: 1280px; margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(240px, 1fr) auto auto;
            gap: 14px;
            align-items: center;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: white url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23656d76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>') no-repeat 12px center;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,91,150,0.12);
        }
        .read-toggle {
            display: inline-flex;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        .read-toggle button {
            padding: 9px 14px;
            border: none;
            background: transparent;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-soft);
            font-family: inherit;
            transition: background 0.15s, color 0.15s;
        }
        .read-toggle button:hover { background: white; color: var(--text); }
        .read-toggle button.active { background: var(--primary); color: white; }
        .counts { font-size: 13px; color: var(--text-soft); white-space: nowrap; }
        .counts strong { color: var(--text); }

        /* Grid */
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 32px 60px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 16px;
        }
        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
            position: relative;
            min-height: 180px;
        }
        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .card.read { opacity: var(--read-fade); }
        .card.read:hover { opacity: 1; }
        .card-keywords {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 10px;
        }
        .card-keyword {
            display: inline-block;
            padding: 2px 8px;
            font-size: 10.5px;
            font-weight: 500;
            border-radius: 4px;
            color: white;
            letter-spacing: 0.1px;
        }
        .card-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text);
            margin: 0 0 8px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-meta {
            font-size: 12px;
            color: var(--text-soft);
            margin: 0 0 14px;
            line-height: 1.45;
        }
        .card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .read-check {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-soft);
            cursor: pointer;
            user-select: none;
        }
        .read-check input { cursor: pointer; accent-color: var(--primary); }
        .open-btn {
            padding: 6px 14px;
            background: var(--primary);
            color: white;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: background 0.15s;
        }
        .open-btn:hover { background: #00477a; }

        .empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 15px;
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-inner">
            <h1>KHS Research Papers Summary</h1>
            <div class="meta">총 <strong>7</strong>편 · 마지막 갱신 2026-04-30 17:32</div>
        </div>
    </header>

    <div class="filterbar">
        <div class="filterbar-inner">
            <input id="search" class="search-input" type="text" placeholder="제목·저자·연도·키워드로 검색...">
            <div class="read-toggle" role="tablist">
                <button data-filter="all" class="active">전체</button>
                <button data-filter="unread">미읽음</button>
                <button data-filter="read">읽음</button>
            </div>
            <div class="counts" id="counts"></div>
        </div>
    </div>

    <main>
        <div class="grid" id="grid"></div>
    </main>

    <script>
        const PAPERS = [{"title": "Sticking the landing: Insect-inspired strategies for safely landing flapping-wing aerial microrobots", "authors": "Nak-seung P. Hyun, Christian M. Chan, Alyssa M. Hernandez, Robert J. Wood", "authors_short": "Nak-seung P. Hyun et al.", "journal": "Science Robotics, Vol. 10, eadq3059 (April 16, 2025) · DOI: 10.1126/scirobotics.adq3059", "year": "2025", "venue": "Science Robotics", "keywords": ["safe landing", "insect-inspired", "compliant leg", "crane fly", "RoboBee", "FWMAV", "insect-scale", "ground effect", "adaptive control", "energy dissipation", "piezoelectric actuator", "bioinspired"], "stem": "Hyun_SciRobotics_2025", "url": "Paper/Hyun_SciRobotics_2025.html"}, {"title": "A review on flapping-wing robots: Recent progress and challenges", "authors": "Saeed Rafee Nekoo, Ramy Rashad, Christophe De Wagter, Sawyer B Fuller, Guido de Croon, Stefano Stramigioli, Anibal Ollero", "authors_short": "Saeed Rafee Nekoo et al.", "journal": "International Journal of Robotics Research, Vol. 44, No. 14, 2025, pp. 2305-2339 · DOI: 10.1177/02783649251343638", "year": "2025", "venue": "International Journal of Robotics Research", "keywords": ["review", "flapping-wing robot", "ornithopter", "bio-inspired", "aerial robotics", "dynamics modeling", "port-Hamiltonian", "intelligent functionalities", "visual servoing", "perching", "obstacle avoidance"], "stem": "Nekoo_IJRR_2025", "url": "Paper/Nekoo_IJRR_2025.html"}, {"title": "Trajectory Generation and Tracking Control for Flapping Wing Robot Three-Dimensional Flight", "authors": "Chen Qian, Rui Chen, Peiyao Shen, Yongchun Fang, Jifu Yan, Tiefeng Li", "authors_short": "Chen Qian et al.", "journal": "IEEE/ASME Transactions on Mechatronics, Vol. 30, No. 2, April 2025, pp. 1248-1260 · DOI: 10.1109/TMECH.2024.3405318", "year": "2025", "venue": "IEEE/ASME Transactions on Mechatronics", "keywords": ["trajectory generation", "trajectory tracking", "flapping-wing robot", "ornithopter", "3D flight", "differential flatness", "Lyapunov stability", "nonlinear control", "underactuated system", "vertical frame dynamics", "obstacle avoidance", "waypoint flight"], "stem": "Qian_TMech_2025", "url": "Paper/Qian_TMech_2025.html"}, {"title": "Free as a Bird: Event-Based Dynamic Sense-and-Avoid for Ornithopter Robot Flight", "authors": "Juan Pablo Rodríguez-Gómez, Raul Tapia, Maria del Mar Guzmán Garcia, Jose Ramiro Martínez-de Dios, Anibal Ollero", "authors_short": "Juan Pablo Rodríguez-Gómez et al.", "journal": "IEEE Robotics and Automation Letters, Vol. 7, No. 2, April 2022, pp. 5413–5420 · DOI: 10.1109/LRA.2022.3153904", "year": "2022", "venue": "IEEE Robotics and Automation Letters", "keywords": ["collision avoidance", "sense-and-avoid", "event camera", "ornithopter", "flapping-wing robot", "dynamic obstacle", "perception and autonomy", "E-Flap", "onboard processing"], "stem": "Rodriguez-Gomez_RAL_2022", "url": "Paper/Rodriguez-Gomez_RAL_2022.html"}, {"title": "Autonomous Formation Flight Control of Large-Sized Flapping-Wing Flying Robots Based on Leader-Follower Strategy", "authors": "Hui Xu, Yuanpeng Wang, Erzhen Pan, Wenfu Xu, Dong Xue", "authors_short": "Hui Xu et al.", "journal": "Journal of Bionic Engineering, Vol. 20, 2023, pp. 2542-2558 · DOI: 10.1007/s42235-023-00402-5", "year": "2023", "venue": "Journal of Bionic Engineering", "keywords": ["formation flight", "leader-follower", "flapping-wing robot", "ornithopter", "large-scale FWFR", "HIT-Phoenix", "outdoor experiment", "periodic flight characteristics", "consensus control"], "stem": "Xu_JBE_2023", "url": "Paper/Xu_JBE_2023.html"}, {"title": "How ornithopters can perch autonomously on a branch", "authors": "Raphael Zufferey, Jesus Tormo-Barbero, Daniel Feliu-Talegón, Saeed Rafee Nekoo, José Ángel Acosta, Anibal Ollero", "authors_short": "Raphael Zufferey et al.", "journal": "Nature Communications, Vol. 13, 7713 (2022) · DOI: 10.1038/s41467-022-35356-5", "year": "2022", "venue": "Nature Communications", "keywords": ["autonomous perching", "bistable claw", "ornithopter", "flapping-wing robot", "branch landing", "bio-inspired", "E-Flap", "P-Flap", "pitch-yaw-altitude control", "close-range correction", "line-scan sensor", "passive grasping"], "stem": "Zufferey_NatComms_2022", "url": "Paper/Zufferey_NatComms_2022.html"}, {"title": "Design of the High-Payload Flapping Wing Robot E-Flap", "authors": "Raphael Zufferey, Jesús Tormo-Barbero, M. Mar Guzmán, Fco. Javier Maldonado, Ernesto Sanchez-Laulhe, Pedro Grau, Martín Pérez, José Ángel Acosta, Anibal Ollero", "authors_short": "Raphael Zufferey et al.", "journal": "IEEE Robotics and Automation Letters, Vol. 6, No. 2, April 2021, pp. 3097-3104 · DOI: 10.1109/LRA.2021.3061373", "year": "2021", "venue": "IEEE Robotics and Automation Letters", "keywords": ["E-Flap", "flapping-wing robot", "ornithopter", "high payload", "eagle-inspired", "bird-scale", "lightweight design", "aero-elastic wing", "modular design", "autonomous flight platform", "GRIFFIN ERC", "physical interaction"], "stem": "Zufferey_RAL_2021", "url": "Paper/Zufferey_RAL_2021.html"}];

        const KEYWORD_PALETTE = [
            '#FF6B6B', '#4ECDC4', '#FFA94D', '#95E1D3', '#C9B1FF',
            '#FFB4B4', '#6BCF7F', '#FF8FB1', '#5B8DEF', '#F4A261',
            '#A8DADC', '#E29578', '#90BE6D', '#F9C74F', '#577590'
        ];
        function keywordColor(kw) {
            let h = 0;
            const k = kw.toLowerCase();
            for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) | 0;
            return KEYWORD_PALETTE[Math.abs(h) % KEYWORD_PALETTE.length];
        }

        const state = {
            search: '',
            readFilter: 'all',           // all | read | unread
        };

        function isRead(paper) {
            return localStorage.getItem('read:' + paper.url) === '1';
        }
        function setRead(paper, val) {
            if (val) localStorage.setItem('read:' + paper.url, '1');
            else localStorage.removeItem('read:' + paper.url);
        }

        function matchesSearch(paper, q) {
            if (!q) return true;
            const kwText = (paper.keywords || []).join(' ');
            const t = (paper.title + ' ' + paper.authors + ' ' + paper.year + ' '
                       + paper.venue + ' ' + paper.stem + ' ' + kwText).toLowerCase();
            return q.toLowerCase().split(/\s+/).every(token => t.includes(token));
        }
        function matchesRead(paper) {
            if (state.readFilter === 'all') return true;
            const r = isRead(paper);
            return state.readFilter === 'read' ? r : !r;
        }
        function visiblePapers() {
            return PAPERS.filter(p =>
                matchesSearch(p, state.search) &&
                matchesRead(p)
            );
        }

        function render() {
            const grid = document.getElementById('grid');
            const visible = visiblePapers();
            grid.innerHTML = '';
            if (visible.length === 0) {
                grid.innerHTML = '<div class="empty">조건에 맞는 논문이 없어요.</div>';
            } else {
                visible.forEach(p => grid.appendChild(makeCard(p)));
            }
            const total = PAPERS.length;
            const readCnt = PAPERS.filter(isRead).length;
            document.getElementById('counts').innerHTML =
                `<strong>${visible.length}</strong> / ${total} · 읽음 ${readCnt}`;
        }

        function makeCard(paper) {
            const card = document.createElement('div');
            card.className = 'card' + (isRead(paper) ? ' read' : '');
            const kws = paper.keywords || [];
            const kwHtml = kws.map(k =>
                `<span class="card-keyword" style="background:${keywordColor(k)}">${k}</span>`
            ).join('');
            card.innerHTML = `
                <div class="card-keywords">${kwHtml}</div>
                <h3 class="card-title">${paper.title}</h3>
                <p class="card-meta">${paper.authors_short} · ${paper.year || ''} · ${paper.venue || ''}</p>
                <div class="card-footer">
                    <label class="read-check">
                        <input type="checkbox" ${isRead(paper) ? 'checked' : ''}>
                        <span>읽음</span>
                    </label>
                    <a class="open-btn" href="${paper.url}" target="_blank" rel="noopener">열기 →</a>
                </div>
            `;
            const cb = card.querySelector('input');
            cb.addEventListener('change', () => { setRead(paper, cb.checked); render(); });
            return card;
        }

        // wire up filter bar
        document.getElementById('search').addEventListener('input', e => {
            state.search = e.target.value;
            render();
        });
        document.querySelectorAll('.read-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.read-toggle button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.readFilter = btn.dataset.filter;
                render();
            });
        });

        render();
    </script>
</body>
</html>
